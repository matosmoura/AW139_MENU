<title>AW 139 · Menu</title>
<style>
  :root{
    --navy: #0d1b2a;
    --navy-2: #13263b;
    --blue-bar: #123a63;
    --blue-bar-2: #0d2c4d;
    --steel: #3a6ea5;
    --amber: #d9a441;
    --paper: #f4f2ec;
    --ink: #13202b;
    --ink-soft: #4a5a68;
    --line: #d8d3c4;
  }

  * { box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    color: var(--ink);
    overscroll-behavior: none;
  }

  /* ---------------- MENU SCREEN ---------------- */
  #menu-screen{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar{
    background: linear-gradient(180deg, var(--blue-bar) 0%, var(--blue-bar-2) 100%);
    color: #fff;
    padding: 28px 20px 24px 20px;
    text-align: center;
    box-shadow:
      inset 0 4px 10px rgba(0,0,0,0.45),
      inset 0 -1px 0 rgba(255,255,255,0.08),
      0 3px 8px rgba(13,27,42,0.3);
  }

  .topbar{ position: relative; }

  .lang-flags{
    position: absolute;
    top: 10px;
    right: 12px;
    display: flex;
    gap: 8px;
    z-index: 2;
  }

  .flag-btn{
    width: 28px;
    height: 28px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.9);
    overflow: hidden;
    background: none;
    display: block;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(6,26,46,0.7), 0 3px 6px rgba(0,0,0,0.45);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .flag-btn svg{ width: 100%; height: 100%; display: block; }
  .flag-btn.active{ border-color: #ffc400; box-shadow: 0 0 0 2px rgba(255,196,0,0.55), 0 2px 0 rgba(6,26,46,0.7), 0 3px 6px rgba(0,0,0,0.45); }

  .flag-btn:active{
    transform: translateY(2px);
    box-shadow: 0 0 0 rgba(6,26,46,0.7), 0 1px 3px rgba(0,0,0,0.4);
  }

  .topbar h1{
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-shadow:
      0 1px 0 rgba(255,255,255,0.35),
      0 2px 1px rgba(255,255,255,0.15),
      0 -1px 1px rgba(0,0,0,0.35),
      0 3px 5px rgba(0,0,0,0.4);
  }

  .topbar .sub{
    margin-top: 6px;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: #a9c3dc;
    text-transform: uppercase;
  }

  .menu-body{
    flex: 1;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 20px 40px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .app-btn{
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 74px;
    background: linear-gradient(180deg, #ffffff 0%, #f6f4ee 100%);
    border: 1.5px solid var(--line);
    border-left: 5px solid var(--steel);
    border-radius: 18px;
    padding: 18px 18px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 6px 0 rgba(13,27,42,0.12),
      0 8px 16px rgba(13,27,42,0.16);
    transform: translateY(0);
    transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.12s ease;
  }

  .app-btn:active{
    transform: translateY(5px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 1px 0 rgba(13,27,42,0.12),
      0 2px 6px rgba(13,27,42,0.14);
  }

  .app-btn .icon{
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 10px;
    background: linear-gradient(180deg, #17324f 0%, var(--navy) 100%);
    color: var(--amber);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.15) inset,
      0 2px 4px rgba(13,27,42,0.35);
  }

  .app-btn .label-block{
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .app-btn .label{
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--ink);
  }

  .app-btn .desc{
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .app-btn.abast .label-block{ min-width: 0; flex: 1; }
  .app-btn.abast .desc{ white-space: nowrap; overflow: hidden; }

  .app-btn.helideck{ border-left-color: #0f6e8c; }
  .app-btn.helideck .label-block{ min-width: 0; flex: 1; }
  .app-btn.helideck .label, .app-btn.helideck .desc{ white-space: nowrap; overflow: hidden; }
  .app-btn.vento{ border-left-color: #e4b650; }
  .app-btn.catb{ border-left-color: #2f7d4f; }
  .app-btn.rto{ border-left-color: #3a6ea5; }
  .app-btn.powercheck{ border-left-color: #d9a441; }
  .app-btn.dropdown{ border-left-color: #4fa8d8; }
  .app-btn.ndl{ border-left-color: #b23a34; }
  .app-btn.wat{ border-left-color: #8a8f98; }
  .app-btn.limitacoes{ border-left-color: #7a4fa0; }
  .app-btn.roc{ border-left-color: #e07a1f; }
  .app-btn.fuel{ border-left-color: #1f9d8a; }
  .app-btn.hover{ border-left-color: #b03a7a; }
  .app-btn.abast{ border-left-color: #4f6bd8; }
  .app-btn.conversor{ border-left-color: #8a7a2f; }

  footer.menu-footer{
    text-align: center;
    font-size: 10.5px;
    color: #9aa7b2;
    padding: 0 20px 24px 20px;
  }

  /* ---------------- APP SCREEN (iframe) ---------------- */
  #app-screen{
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: none;
    flex-direction: column;
    z-index: 10;
  }

  #app-screen.active{ display: flex; }

  .app-topbar{
    background: linear-gradient(180deg, var(--blue-bar) 0%, var(--blue-bar-2) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    flex: 0 0 auto;
    box-shadow: 0 4px 12px rgba(13,27,42,0.25);
    position: relative;
    z-index: 2;
  }

  .back-btn{
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    flex: 0 0 auto;        /* tamanho fixo: título longo não espreme o botão */
    white-space: nowrap;
  }

  .back-btn:active{ background: rgba(255,255,255,0.22); }

  .app-topbar .app-title{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #cfe0f0;
    min-width: 0;
  }

  #app-frame{
    flex: 1 1 auto;
    width: 100%;
    border: 0;
    background: var(--paper);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  #loading-msg{
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-size: 13px;
    color: var(--ink-soft);
    z-index: 20;
  }
</style>
</head>

  function awTranslateString(str, isAttr){
    if (!str) return str;
    const t = str.trim();
    if (!t) return str;
    const lead = str.match(/^\s*/)[0], trail = str.match(/\s*$/)[0];
    if (isAttr && Object.prototype.hasOwnProperty.call(AW_ATTR, t)) return lead + AW_ATTR[t] + trail;
    if (Object.prototype.hasOwnProperty.call(AW_EN, t)) return lead + AW_EN[t] + trail;

    for (let i = 0; i < AW_RULES.length; i++) out = out.replace(AW_RULES[i][0], AW_RULES[i][1]);

  function awTranslateTextNode(n){
    const p = n.parentNode;
    if (p && (p.nodeName === 'SCRIPT' || p.nodeName === 'STYLE')) return;
    const v = awTranslateString(n.nodeValue, false);
    if (v !== n.nodeValue) n.nodeValue = v;

  function awTranslateAttrs(el){
    if (!el || el.nodeType !== 1) return;
    AW_ATTRS.forEach(function(a){

    awTranslateTree(root);
    awObserver = new MutationObserver(function(muts){

  function awApplyMenuLang(){

    roots.forEach(function(r){
      if (!r) return;
      const w = document.createTreeWalker(r, NodeFilter.SHOW_TEXT, null);
      const nodes = [];
      while (w.nextNode()) nodes.push(w.currentNode);
      nodes.forEach(function(n){
        if (n.__awOrig === undefined) n.__awOrig = n.nodeValue;
        n.nodeValue = window.AW.lang === 'en' ? awTranslateString(n.__awOrig, false) : n.__awOrig;
      });
    });
    (function(){
      var body = document.querySelector('.menu-body');
      if (!body) return;
      var btns = Array.prototype.slice.call(body.querySelectorAll(':scope > .app-btn'));
      btns.sort(function(x, y){
        return x.querySelector('.label').textContent.trim().localeCompare(y.querySelector('.label').textContent.trim(), window.AW.lang === 'en' ? 'en' : 'pt', { sensitivity: 'base' });
      });
      btns.forEach(function(b){ body.appendChild(b); });
    })();
    document.querySelectorAll('.app-btn .icon[data-en]').forEach(function(ic){
      ic.textContent = window.AW.lang === 'en' ? ic.getAttribute('data-en') : ic.getAttribute('data-pt');
    });
    document.querySelectorAll('.flag-btn').forEach(function(b){

  function loadShadowApp(container, app) {
    const root = container.shadowRoot || container.attachShadow({ mode: 'open' });
    root.innerHTML = '';
    const styleEl = document.createElement('style');
    styleEl.textContent = app.style;
    root.appendChild(styleEl);
    const bodyWrap = document.createElement('div');
    bodyWrap.innerHTML = app.body;
    root.appendChild(bodyWrap);

  const appFrame = document.getElementById('app-frame');
  const appTitle = document.getElementById('appTitle');
  const backBtn = document.getElementById('backBtn');

  function openApp(key, title) {
    loadingMsg.style.display = 'flex';
    setTimeout(() => {

      } catch (err) {
        alert('Erro ao carregar o app "' + title + '": ' + (err && err.message ? err.message : err));
      } finally {
        loadingMsg.style.display = 'none';
      }
    }, 10);
  }

  document.querySelectorAll('.app-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      try {
        const key = btn.getAttribute('data-app');
        const title = btn.getAttribute('data-title');
        openApp(key, title);
      } catch (err) {
        loadingMsg.style.display = 'none';
        alert('Erro ao abrir o app: ' + (err && err.message ? err.message : err));
      }
    });
  });

  let currentBlobUrl = null;

    awStopObserver();

<script>
  // PWA: só quando servido via http(s) (ex.: GitHub Pages). Aberto como arquivo, nada muda.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
        reg.update();
        // ao voltar para o app (ex.: app instalado reaberto), procura versão nova
        document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') reg.update(); });
      }).catch(function(){});
      // quando uma versão nova assume, recarrega uma vez (se nenhum app estiver aberto)
      var hadController = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (!hadController || reloaded) return;
        if (document.getElementById('app-screen').classList.contains('active')) return;
        reloaded = true; location.reload();
      });
      // página carregada do cache com versão diferente da publicada: busca a nova
      fetch('index.html', { cache: 'no-cache' }).then(function(r){ return r.text(); }).then(function(html){
        var m = html.match(/<span class="app-ver"> · (v[0-9a-f]+)<\/span>/);
        var cur = document.querySelector('.app-ver');
        if (m && cur && cur.textContent.indexOf(m[1]) < 0 && !sessionStorage.getItem('aw139_reload_' + m[1])) {
          try { sessionStorage.setItem('aw139_reload_' + m[1], '1'); } catch (e) {}
          if (!document.getElementById('app-screen').classList.contains('active')) location.reload();
        }
      }).catch(function(){});
    });
  }
</script>
